<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to V-orra - Access your dashboard, manage tickets, and stay connected.">
    <title>Sign In | V-orra</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg">

    <!-- Preload fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="/styles/base.css">
    <link rel="stylesheet" href="/styles/liquid-glass.css">
    <link rel="stylesheet" href="/styles/auth.css">

</head>

<body>
    <!-- Noise Overlay -->
    <div class="noise-overlay"></div>

    <!-- Back to Home -->
    <a href="/" class="back-home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
        Back to Home
    </a>

    <!-- Auth Page -->
    <main class="auth-page">
        <div class="auth-container">
            <div class="auth-card">
                <!-- Header -->
                <div class="auth-header">
                    <a href="/" class="nav-logo">V-<span class="blue">orra</span></a>
                    <h1 class="auth-title" id="auth-title">Welcome Back</h1>
                    <p class="auth-subtitle" id="auth-subtitle">Sign in to access your dashboard</p>
                </div>

                <!-- Tabs -->
                <div class="auth-tabs">
                    <button class="auth-tab active" data-tab="signin">Sign In</button>
                    <button class="auth-tab" data-tab="signup">Sign Up</button>
                </div>

                <!-- Error Message -->
                <div class="auth-error" id="auth-error">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10" />
                        <line x1="12" y1="8" x2="12" y2="12" />
                        <line x1="12" y1="16" x2="12.01" y2="16" />
                    </svg>
                    <span id="error-message"></span>
                </div>

                <!-- Success Message -->
                <div class="auth-success" id="auth-success">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                        <polyline points="22 4 12 14.01 9 11.01" />
                    </svg>
                    <span id="success-message"></span>
                </div>

                <!-- Google Sign In -->
                <div class="social-auth">
                    <button type="button" class="btn-google" id="btn-google">
                        <svg viewBox="0 0 24 24" width="20" height="20">
                            <path fill="#4285F4"
                                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                            <path fill="#34A853"
                                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                            <path fill="#FBBC05"
                                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                            <path fill="#EA4335"
                                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                        </svg>
                        Continue with Google
                    </button>
                </div>

                <!-- Divider -->
                <div class="auth-divider">
                    <span>or</span>
                </div>

                <!-- Sign In Form -->
                <form class="auth-form" id="signin-form">
                    <div class="form-group">
                        <label for="signin-email">Email</label>
                        <input type="email" id="signin-email" name="email" placeholder="you@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="signin-password">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="signin-password" name="password" placeholder="••••••••" required
                                minlength="6">
                            <button type="button" class="password-toggle" data-target="signin-password">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="forgot-password">
                        <a href="#" id="forgot-password-link">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn-submit" id="btn-signin">Sign In</button>
                </form>

                <!-- Sign Up Form (Hidden by default) -->
                <form class="auth-form" id="signup-form" style="display: none;">
                    <div class="form-group">
                        <label for="signup-email">Email</label>
                        <input type="email" id="signup-email" name="email" placeholder="you@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="signup-password">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="signup-password" name="password"
                                placeholder="Create a strong password" required minlength="6">
                            <button type="button" class="password-toggle" data-target="signup-password">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                            </button>
                        </div>
                        <div class="password-strength" id="password-strength">
                            <div class="strength-bar"></div>
                            <div class="strength-bar"></div>
                            <div class="strength-bar"></div>
                            <div class="strength-bar"></div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="signup-confirm">Confirm Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="signup-confirm" name="confirmPassword"
                                placeholder="Confirm your password" required minlength="6">
                        </div>
                    </div>

                    <button type="submit" class="btn-submit" id="btn-signup">Create Account</button>
                </form>

                <!-- Forgot Password Form (Hidden by default) -->
                <form class="auth-form" id="forgot-form" style="display: none;">
                    <div class="form-group">
                        <label for="forgot-email">Email</label>
                        <input type="email" id="forgot-email" name="email" placeholder="you@example.com" required>
                    </div>

                    <button type="submit" class="btn-submit" id="btn-reset">Send Reset Link</button>

                    <div style="text-align: center; margin-top: 1rem;">
                        <a href="#" id="back-to-signin" style="color: #4285F4; font-size: 0.875rem;">Back to Sign In</a>
                    </div>
                </form>

                <!-- Footer -->
                <div class="auth-footer" id="auth-footer">
                    <p>Don't have an account? <a href="#" id="switch-to-signup">Sign up</a></p>
                </div>
            </div>
        </div>
    </main>

    <!-- Auth Script -->
    <script type="module">
        import {
            signInWithGoogle,
            signInWithEmail,
            signUpWithEmail,
            resetPassword,
            onAuthChange
        } from '/src/firebase-config.js';

        // DOM Elements
        const tabs = document.querySelectorAll('.auth-tab');
        const signinForm = document.getElementById('signin-form');
        const signupForm = document.getElementById('signup-form');
        const forgotForm = document.getElementById('forgot-form');
        const authTitle = document.getElementById('auth-title');
        const authSubtitle = document.getElementById('auth-subtitle');
        const authFooter = document.getElementById('auth-footer');
        const authError = document.getElementById('auth-error');
        const errorMessage = document.getElementById('error-message');
        const authSuccess = document.getElementById('auth-success');
        const successMessage = document.getElementById('success-message');
        const googleBtn = document.getElementById('btn-google');
        const forgotLink = document.getElementById('forgot-password-link');
        const backToSignin = document.getElementById('back-to-signin');
        const switchToSignup = document.getElementById('switch-to-signup');

        // Check auth state on load
        onAuthChange((user) => {
            if (user) {
                // Redirect to tickets page if logged in
                const urlParams = new URLSearchParams(window.location.search);
                const redirect = urlParams.get('redirect') || '/';
                window.location.href = redirect;
            }
        });

        // Tab switching
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const targetTab = tab.dataset.tab;
                switchTab(targetTab);
            });
        });

        function switchTab(tab) {
            hideMessages();
            tabs.forEach(t => t.classList.remove('active'));
            document.querySelector(`[data-tab="${tab}"]`).classList.add('active');

            if (tab === 'signin') {
                signinForm.style.display = 'flex';
                signupForm.style.display = 'none';
                forgotForm.style.display = 'none';
                authTitle.textContent = 'Welcome Back';
                authSubtitle.textContent = 'Sign in to access your dashboard';
                authFooter.innerHTML = '<p>Don\'t have an account? <a href="#" id="switch-to-signup">Sign up</a></p>';
                document.getElementById('switch-to-signup').addEventListener('click', (e) => {
                    e.preventDefault();
                    switchTab('signup');
                });
            } else {
                signinForm.style.display = 'none';
                signupForm.style.display = 'flex';
                forgotForm.style.display = 'none';
                authTitle.textContent = 'Create Account';
                authSubtitle.textContent = 'Join V-orra and start making an impact';
                authFooter.innerHTML = '<p>Already have an account? <a href="#" id="switch-to-signin">Sign in</a></p>';
                document.getElementById('switch-to-signin').addEventListener('click', (e) => {
                    e.preventDefault();
                    switchTab('signin');
                });
            }
        }

        // Forgot password
        forgotLink.addEventListener('click', (e) => {
            e.preventDefault();
            showForgotPassword();
        });

        backToSignin.addEventListener('click', (e) => {
            e.preventDefault();
            switchTab('signin');
        });

        function showForgotPassword() {
            hideMessages();
            signinForm.style.display = 'none';
            signupForm.style.display = 'none';
            forgotForm.style.display = 'flex';
            authTitle.textContent = 'Reset Password';
            authSubtitle.textContent = 'Enter your email to receive a reset link';
            authFooter.style.display = 'none';
            document.querySelector('.social-auth').style.display = 'none';
            document.querySelector('.auth-divider').style.display = 'none';
            document.querySelector('.auth-tabs').style.display = 'none';
        }

        // Password toggles
        document.querySelectorAll('.password-toggle').forEach(btn => {
            btn.addEventListener('click', () => {
                const targetId = btn.dataset.target;
                const input = document.getElementById(targetId);
                const type = input.type === 'password' ? 'text' : 'password';
                input.type = type;
                btn.innerHTML = type === 'password'
                    ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'
                    : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
            });
        });

        // Password strength
        const signupPassword = document.getElementById('signup-password');
        signupPassword.addEventListener('input', (e) => {
            updatePasswordStrength(e.target.value);
        });

        function updatePasswordStrength(password) {
            const bars = document.querySelectorAll('.strength-bar');
            let strength = 0;
            if (password.length >= 6) strength++;
            if (password.length >= 8) strength++;
            if (/[A-Z]/.test(password) && /[a-z]/.test(password)) strength++;
            if (/[0-9]/.test(password) || /[^A-Za-z0-9]/.test(password)) strength++;

            bars.forEach((bar, i) => {
                bar.className = 'strength-bar';
                if (i < strength) {
                    if (strength <= 1) bar.classList.add('weak');
                    else if (strength <= 2) bar.classList.add('medium');
                    else bar.classList.add('strong');
                }
            });
        }

        // Google Sign In
        googleBtn.addEventListener('click', async () => {
            setLoading(googleBtn, true);
            const result = await signInWithGoogle();
            setLoading(googleBtn, false);

            if (!result.success) {
                showError(result.error);
            }
        });

        // Sign In Form
        signinForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();

            const email = document.getElementById('signin-email').value;
            const password = document.getElementById('signin-password').value;
            const btn = document.getElementById('btn-signin');

            setLoading(btn, true);
            const result = await signInWithEmail(email, password);
            setLoading(btn, false);

            if (!result.success) {
                showError(result.error);
            }
        });

        // Sign Up Form
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();

            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const confirm = document.getElementById('signup-confirm').value;
            const btn = document.getElementById('btn-signup');

            if (password !== confirm) {
                showError('Passwords do not match.');
                return;
            }

            setLoading(btn, true);
            const result = await signUpWithEmail(email, password);
            setLoading(btn, false);

            if (!result.success) {
                showError(result.error);
            }
        });

        // Forgot Password Form
        forgotForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();

            const email = document.getElementById('forgot-email').value;
            const btn = document.getElementById('btn-reset');

            setLoading(btn, true);
            const result = await resetPassword(email);
            setLoading(btn, false);

            if (result.success) {
                showSuccess('Password reset email sent! Check your inbox.');
            } else {
                showError(result.error);
            }
        });

        // Helper functions
        function showError(message) {
            errorMessage.textContent = message;
            authError.classList.add('show');
            authSuccess.classList.remove('show');
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            authSuccess.classList.add('show');
            authError.classList.remove('show');
        }

        function hideMessages() {
            authError.classList.remove('show');
            authSuccess.classList.remove('show');
        }

        function setLoading(btn, loading) {
            btn.classList.toggle('loading', loading);
            btn.disabled = loading;
        }

        // Switch to signup link
        switchToSignup.addEventListener('click', (e) => {
            e.preventDefault();
            switchTab('signup');
        });
    </script>
</body>

</html>
